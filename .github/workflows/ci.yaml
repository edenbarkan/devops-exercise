# CI: test -> build multi-arch image -> push to GHCR -> bump the tag in git.
# Argo CD watches k8s/ and rolls the new tag out; CI never talks to the cluster.
name: ci

on:
  push:
    branches: [main]
    # Only app changes produce a new image. The tag-bump commit touches only
    # k8s/, so it can't retrigger this workflow (a deploy-key push DOES start
    # workflows, unlike GITHUB_TOKEN, so this filter is what prevents a loop).
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

# PRs: newest run wins. main: runs queue, never cancel a half-done tag bump.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache: false # no third-party modules, nothing to cache
      - name: Vet and test
        working-directory: app
        run: |
          go vet ./...
          go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile cross-compiles on $BUILDPLATFORM, so no QEMU is needed.
      # PRs build both arches to prove they compile but push nothing.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }} # immutable, never "latest"
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the push uses the deploy key, not GITHUB_TOKEN
    steps:
      # The deploy key is the only actor allowed past the "main: PR only" ruleset.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Point k8s at the new image
        env:
          TAG: ${{ github.sha }}
        run: |
          yq --version
          yq -i '(.images[] | select(.name == strenv(IMAGE)) | .newTag) = strenv(TAG)' k8s/kustomization.yaml
          git diff --exit-code --quiet k8s/kustomization.yaml && { echo "Tag already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(k8s): deploy image ${TAG::7}"
          # Retry in case main moved while we were building.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed, retrying"; sleep 5
          done
          exit 1
